name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm provenance (npm publish --provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: codegen freshness
        run: |
          npm run codegen:ts
          git diff --exit-code -- src/ts/
      - run: node --test tests/ts/*.test.mjs
      - name: verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    # PyPI publish uses Trusted Publishing (OIDC) — no PyPI token in
    # secrets. Configure on PyPI: project's "Publishing" tab → Add
    # pending publisher → workflow file `release.yml`, environment
    # `release`. See README §PyPI setup.
    #
    # Until the PyPI package name is claimed, this job is gated behind
    # the existence of the PYPI_TRUSTED secret (a placeholder we set
    # to "true" once trusted publishing is configured). Until then,
    # the engine pins via `pip install git+...@vX.Y.Z`.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    if: ${{ vars.PYPI_TRUSTED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install build deps
        run: |
          python -m pip install --upgrade pip
          pip install 'datamodel-code-generator>=0.25.6' build
      - name: codegen
        run: python codegen/py.py
      - name: verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match pyproject.toml version ($PKG)"
            exit 1
          fi
      - name: build sdist + wheel
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
