[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "stiq-design-schema"
version = "1.2.0"
description = "Stiq design document — JSON Schema source with generated Pydantic models. The contract between the Stiq editor and the Stiq stitch engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "angryAtNumbers" },
]
keywords = ["stiq", "embroidery", "json-schema", "design", "contract"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
codegen = [
  "datamodel-code-generator>=0.25.6",
]
test = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/angryAtNumbers/stiq-schema"
Repository = "https://github.com/angryAtNumbers/stiq-schema"
Issues = "https://github.com/angryAtNumbers/stiq-schema/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/py/stiq_design_schema"]

# Ship the JSON Schema and golden fixtures inside the wheel so
# consumers can read them via importlib.resources without needing
# the source tree. Mirror what package.json exposes via its
# `exports` map for the npm side.
[tool.hatch.build.targets.wheel.force-include]
"schema/design.v1.json" = "stiq_design_schema/schema/design.v1.json"
"schema/design.v1.1.json" = "stiq_design_schema/schema/design.v1.1.json"
"schema/design.v1.2.json" = "stiq_design_schema/schema/design.v1.2.json"
"fixtures" = "stiq_design_schema/fixtures"

[tool.hatch.build.targets.sdist]
include = [
  "/src/py",
  "/schema",
  "/fixtures",
  "/README.md",
  "/CHANGELOG.md",
]
