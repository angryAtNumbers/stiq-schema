[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "stiq-design-schema"
version = "1.0.0"
description = "Stiq design document — JSON Schema source with generated Pydantic models. The contract between the Stiq editor and the Stiq stitch engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "angryAtNumbers" },
]
keywords = ["stiq", "embroidery", "json-schema", "design", "contract"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
codegen = [
  "datamodel-code-generator>=0.25.6",
]
test = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/angryAtNumbers/stiq-schema"
Repository = "https://github.com/angryAtNumbers/stiq-schema"
Issues = "https://github.com/angryAtNumbers/stiq-schema/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/py/stiq_design_schema"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/py",
  "/schema",
  "/fixtures",
  "/README.md",
  "/CHANGELOG.md",
]
